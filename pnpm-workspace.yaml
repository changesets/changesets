packages:
  - packages/*
  - scripts/*
  - docs

allowBuilds:
  "@pnpm/pnpr": true
  pnpm: true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

# Bootstrap scripts intentionally run before the workspace is fully installed.
verifyDepsBeforeRun: warn

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
