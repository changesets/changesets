packages:
  - packages/*
  - scripts/*
  - site

allowBuilds:
  "@pnpm/pnpr": true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@pnpm/pnpr@0.1.0-alpha.8"
  - "@pnpm/pnpr.darwin-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.darwin-x64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-arm64-musl@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-x64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-x64-musl@0.1.0-alpha.8"
  - "@pnpm/pnpr.win32-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.win32-x64@0.1.0-alpha.8"
  - "@vitest/coverage-v8@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - tinybench@6.1.4
  - vite@8.2.0
  - vitest@5.0.0

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

# Bootstrap scripts intentionally run before the workspace is fully installed.
verifyDepsBeforeRun: warn

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
