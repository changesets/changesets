packages:
  - packages/*
  - scripts/*
  - site

allowBuilds:
  "@pnpm/pnpr": true
  pnpm: true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@pnpm/exe.darwin-arm64@12.0.0"
  - "@pnpm/exe.darwin-x64@12.0.0"
  - "@pnpm/exe.linux-arm64@12.0.0"
  - "@pnpm/exe.linux-arm64-musl@12.0.0"
  - "@pnpm/exe.linux-x64@12.0.0"
  - "@pnpm/exe.linux-x64-musl@12.0.0"
  - "@pnpm/exe.win32-arm64@12.0.0"
  - "@pnpm/exe.win32-x64@12.0.0"
  - "@pnpm/pnpr@0.1.0-alpha.8"
  - "@pnpm/pnpr.darwin-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.darwin-x64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-arm64-musl@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-x64@0.1.0-alpha.8"
  - "@pnpm/pnpr.linux-x64-musl@0.1.0-alpha.8"
  - "@pnpm/pnpr.win32-arm64@0.1.0-alpha.8"
  - "@pnpm/pnpr.win32-x64@0.1.0-alpha.8"
  - pnpm@12.0.0
  - vite@8.2.0

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
