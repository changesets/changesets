packages:
  - packages/*
  - scripts/*
  - docs

allowBuilds:
  "@pnpm/pnpr": true
  pnpm: true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@pnpm/pnpr@0.1.0-alpha.22"
  - "@pnpm/pnpr.darwin-arm64@0.1.0-alpha.22"
  - "@pnpm/pnpr.darwin-x64@0.1.0-alpha.22"
  - "@pnpm/pnpr.linux-arm64-musl@0.1.0-alpha.22"
  - "@pnpm/pnpr.linux-arm64@0.1.0-alpha.22"
  - "@pnpm/pnpr.linux-x64-musl@0.1.0-alpha.22"
  - "@pnpm/pnpr.linux-x64@0.1.0-alpha.22"
  - "@pnpm/pnpr.win32-arm64@0.1.0-alpha.22"
  - "@pnpm/pnpr.win32-x64@0.1.0-alpha.22"

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

# Bootstrap scripts intentionally run before the workspace is fully installed.
verifyDepsBeforeRun: warn

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
