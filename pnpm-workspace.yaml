packages:
  - packages/*
  - scripts/*
  - site

allowBuilds:
  "@pnpm/pnpr": true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - vite@8.2.0

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
