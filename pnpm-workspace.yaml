packages:
  - packages/*
  - scripts/*
  - site

allowBuilds:
  "@pnpm/pnpr": true

blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - tinybench@6.1.4
  - vite@8.2.0
  - vitest@5.0.0

overrides:
  "vitepress>@docsearch/js": "-"
  "vitepress>@docsearch/sidepanel-js": "-"

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - pnpm@10.34.5
