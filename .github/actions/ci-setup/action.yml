name: Setup CI

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  skip-cache:
    description: "Whether to skip the cache"
    required: false
    default: "false"
  download-dist:
    description: "Whether to download a dist folder artifact from the current run"
    required: false
    default: "false"
  install-e2e:
    description: "Whether to install the e2e workspace and its dependencies"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.skip-cache != 'true' }}
        # Use separate cache keys for regular and E2E dependency installations.
        cache_dependency_path: |
          pnpm-lock.yaml
          ${{ inputs.install-e2e == 'true' && 'scripts/e2e/package.json' || '' }}

    - name: Install dependencies
      if: ${{ inputs.install-e2e != 'true' }}
      shell: bash
      run: pnpm run bootstrap

    # E2E consumes prebuilt dist artifacts, so it only installs its workspace dependency closure.
    - name: Install E2E dependencies
      if: ${{ inputs.install-e2e == 'true' }}
      shell: bash
      run: pnpm run bootstrap:e2e

    - name: Check with manypkg
      if: ${{ inputs.install-e2e != 'true' }}
      shell: bash
      run: pnpm manypkg check

    - name: Download dist artifacts
      if: ${{ inputs.download-dist == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
