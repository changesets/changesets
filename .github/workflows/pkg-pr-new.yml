name: pkg-pr-new

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  publish:
    name: Publish
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pkg.pr.new') }}
    runs-on: ubuntu-latest

    steps:
      - uses: $/.github/actions/ci-setup
        with:
          node-version: 26
          skip-cache: true # avoid cache poisoning attacks

      - name: Build
        run: pnpm build

      # zizmor: ignore[use-trusted-publishing] we're not publishing to npm here
      - run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm --commentWithDev --commentWithSha './packages/*'
